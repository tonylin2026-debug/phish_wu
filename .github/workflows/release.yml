name: Build Gophish Release
on:
    release:
        types: [created]
    # Lets a published release be rebuilt and its assets reattached without
    # deleting and recreating it - which is otherwise the only way to fire the
    # release event again.
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag to build and attach assets to
                required: true
                type: string

env:
    TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
    build:
        name: Build Binary
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [windows-latest, ubuntu-latest, macos-latest]
                arch: ['386', amd64]
                # We sometimes use different verbiage for things (e.g. "darwin"
                # for the GOOS build flag and "osx" in the actual release ZIP).
                # We need to specify those here.
                include:
                    - os: windows-latest
                      goos: windows
                      bin: 'gophish.exe'
                      releaseos: windows
                    - os: ubuntu-latest
                      goos: linux
                      bin: 'gophish'
                      releaseos: linux
                    - os: macos-latest
                      goos: darwin
                      bin: 'gophish'
                      releaseos: osx
                # Don't build windows-32bit due to missing MinGW dependencies
                # Don't build osx-32bit due to eventual drop in Go support
                exclude:
                    - os: windows-latest
                      arch: '386'
                    - os: macos-latest
                      arch: '386'
        steps:
            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version: '1.23'
            - if: matrix.os == 'ubuntu-latest'
              run: sudo apt-get update && sudo apt-get install -y gcc-multilib
            - if: matrix.arch == '386'
              run: echo "RELEASE=gophish-${{ env.TAG }}-${{ matrix.releaseos }}-32bit" >> $GITHUB_ENV
            - if: matrix.arch == 'amd64'
              run: echo "RELEASE=gophish-${{ env.TAG }}-${{ matrix.releaseos }}-64bit" >> $GITHUB_ENV
            - if: matrix.os == 'windows-latest'
              run: echo "RELEASE=gophish-${{ env.TAG }}-${{ matrix.releaseos }}-64bit" | Out-File -FilePath $env:GITHUB_ENV -Append # https://github.com/actions/runner/issues/1636
            # Pin to the tag so a workflow_dispatch rebuild produces the same
            # source as the original release, not whatever the default branch
            # happens to be now.
            - uses: actions/checkout@v4
              with:
                ref: ${{ env.TAG }}
            - name: Build ${{ matrix.goos }}/${{ matrix.arch }}
              run: go build -o ${{ matrix.bin }}
              env:
                GOOS: ${{ matrix.goos }}
                GOARCH: ${{ matrix.arch }}
                CGO_ENABLED: 1
            - name: Upload to artifacts
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.RELEASE }}
                path: ${{ matrix.bin }}

    package:
        name: Package Assets
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v4
              with:
                ref: ${{ env.TAG }}
            - uses: actions/download-artifact@v4
              with:
                path: bin
            - name: Package Releases
              run: |
                mkdir releases;
                for RELEASE_DIR in bin/*
                do
                  echo "Creating release $RELEASE_DIR"
                  for BINARY in $RELEASE_DIR/*
                  do
                    cp $BINARY .;
                    zip -r releases/$(basename $RELEASE_DIR).zip \
                      $(basename ${BINARY}) \
                      static/js/dist \
                      static/js/src/vendor/ckeditor \
                      static/css/dist \
                      static/images \
                      static/font \
                      static/db \
                      db \
                      templates \
                      README.md \
                      VERSION \
                      LICENSE \
                      config.json;
                    rm $BINARY;
                  done
                done
            - name: Upload to artifacts
              uses: actions/upload-artifact@v4
              with:
                name: releases
                path: releases/*.zip
    
    upload:
        name: Upload to the Release
        runs-on: ubuntu-latest
        needs: package
        # GITHUB_TOKEN now defaults to read-only, so without this the uploads
        # come back "Resource not accessible by integration" and the release
        # ends up published with no assets attached.
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                name: releases
                path: releases/
            # Previously this was hand-rolled curl against the upload_url. It
            # had no -f, so an HTTP error still reported the step as green.
            - name: Upload Archives to Release
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                TAG: ${{ env.TAG }}
              run: |
                set -euo pipefail
                ls -lh releases/
                gh release upload "$TAG" releases/*.zip \
                  --repo "${{ github.repository }}" --clobber
            - name: Every archive is attached
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                TAG: ${{ env.TAG }}
              run: |
                set -euo pipefail
                gh release view "$TAG" --repo "${{ github.repository }}" \
                  --json assets -q '.assets[].name' | sort > /tmp/attached.txt
                for f in releases/*.zip; do basename "$f"; done | sort > /tmp/built.txt
                echo "built:"; cat /tmp/built.txt
                echo "attached:"; cat /tmp/attached.txt
                # Every archive built must be attached. A release may also carry
                # assets from an earlier run, which comm ignores: counting them
                # would fail the step even though nothing is missing.
                missing=$(comm -23 /tmp/built.txt /tmp/attached.txt)
                if [ -n "$missing" ]; then
                  echo "::error::these archives were not attached: $missing"
                  exit 1
                fi
            # This used to PATCH the release body with just the hash table,
            # which discarded whatever release notes had been written. Append
            # instead.
            - name: Append SHA256 hashes to the release notes
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                TAG: ${{ env.TAG }}
              run: |
                set -euo pipefail
                gh release view "$TAG" --repo "${{ github.repository }}" \
                  --json body -q .body > notes.md

                if grep -q '^## SHA256' notes.md; then
                  echo "hashes already present, leaving the notes alone"
                  exit 0
                fi

                {
                  echo
                  echo "## SHA256"
                  echo
                  echo "| Hash | Filename |"
                  echo "|------|----------|"
                  for FILE in releases/*; do
                    echo "| \`$(sha256sum "$FILE" | cut -d' ' -f1)\` | $(basename "$FILE") |"
                  done
                } >> notes.md

                gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file notes.md
