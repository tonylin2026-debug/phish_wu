name: Build Gophish Release
on:
    release:
        types: [created]
    # Lets a published release be rebuilt and its assets reattached without
    # deleting and recreating it - which is otherwise the only way to fire the
    # release event again.
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag to build and attach assets to
                required: true
                type: string

env:
    TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
    build:
        name: Build Binary
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                # linux/amd64 only. This fork is deployed on Ubuntu x86-64 and
                # nowhere else, so the other three archives cost four runners per
                # release and were never installed.
                #
                # Note what this gives up: ci.yml builds on ubuntu-latest alone,
                # so the windows and macos jobs here were the only thing compiling
                # this code for another platform. Nothing in the tree is platform
                # specific today - no build tags beyond the Go version ones in
                # context/, no _windows.go or _darwin.go - but non-portable code
                # added later will no longer be caught before a release.
                #
                # To publish a platform again, add its entry below and restore the
                # step that sets RELEASE for it: a 386 build needs gcc-multilib on
                # ubuntu, and windows needs the Out-File form of the assignment
                # because of actions/runner#1636.
                include:
                    - os: ubuntu-latest
                      arch: amd64
                      goos: linux
                      bin: 'gophish'
                      releaseos: linux
        steps:
            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version: '1.23'
            - run: echo "RELEASE=gophish-${{ env.TAG }}-${{ matrix.releaseos }}-64bit" >> $GITHUB_ENV
            # Pin to the tag so a workflow_dispatch rebuild produces the same
            # source as the original release, not whatever the default branch
            # happens to be now.
            - uses: actions/checkout@v4
              with:
                ref: ${{ env.TAG }}
            - name: Build ${{ matrix.goos }}/${{ matrix.arch }}
              run: go build -o ${{ matrix.bin }}
              env:
                GOOS: ${{ matrix.goos }}
                GOARCH: ${{ matrix.arch }}
                CGO_ENABLED: 1
            - name: Upload to artifacts
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.RELEASE }}
                path: ${{ matrix.bin }}

    package:
        name: Package Assets
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v4
              with:
                ref: ${{ env.TAG }}
            - uses: actions/download-artifact@v4
              with:
                path: bin
            - name: Package Releases
              run: |
                mkdir releases;
                for RELEASE_DIR in bin/*
                do
                  echo "Creating release $RELEASE_DIR"
                  for BINARY in $RELEASE_DIR/*
                  do
                    cp $BINARY .;
                    zip -r releases/$(basename $RELEASE_DIR).zip \
                      $(basename ${BINARY}) \
                      static/js/dist \
                      static/js/src/vendor/ckeditor \
                      static/css/dist \
                      static/images \
                      static/font \
                      static/db \
                      db \
                      templates \
                      deploy \
                      library \
                      README.md \
                      VERSION \
                      LICENSE \
                      config.json;
                    rm $BINARY;
                  done
                done
            - name: Upload to artifacts
              uses: actions/upload-artifact@v4
              with:
                name: releases
                path: releases/*.zip
    
    upload:
        name: Upload to the Release
        runs-on: ubuntu-latest
        needs: package
        # GITHUB_TOKEN now defaults to read-only, so without this the uploads
        # come back "Resource not accessible by integration" and the release
        # ends up published with no assets attached.
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                name: releases
                path: releases/
            # Previously this was hand-rolled curl against the upload_url. It
            # had no -f, so an HTTP error still reported the step as green.
            - name: Upload Archives to Release
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                TAG: ${{ env.TAG }}
              run: |
                set -euo pipefail
                ls -lh releases/
                gh release upload "$TAG" releases/*.zip \
                  --repo "${{ github.repository }}" --clobber
            - name: Every archive is attached
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                TAG: ${{ env.TAG }}
              run: |
                set -euo pipefail
                gh release view "$TAG" --repo "${{ github.repository }}" \
                  --json assets -q '.assets[].name' | sort > /tmp/attached.txt
                for f in releases/*.zip; do basename "$f"; done | sort > /tmp/built.txt
                echo "built:"; cat /tmp/built.txt
                echo "attached:"; cat /tmp/attached.txt
                # Every archive built must be attached. A release may also carry
                # assets from an earlier run, which comm ignores: counting them
                # would fail the step even though nothing is missing.
                missing=$(comm -23 /tmp/built.txt /tmp/attached.txt)
                if [ -n "$missing" ]; then
                  echo "::error::these archives were not attached: $missing"
                  exit 1
                fi
            # This used to PATCH the release body with just the hash table,
            # which discarded whatever release notes had been written. Append
            # instead.
            - name: Append SHA256 hashes to the release notes
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                TAG: ${{ env.TAG }}
              run: |
                set -euo pipefail
                gh release view "$TAG" --repo "${{ github.repository }}" \
                  --json body -q .body > notes.md

                # Drop any table from an earlier run before writing a new
                # one. workflow_dispatch can rebuild a published tag, and
                # keeping the old hashes would leave the notes stating
                # checksums that do not match the attached files.
                sed -i '/^## SHA256$/,$d' notes.md

                {
                  echo
                  echo "## SHA256"
                  echo
                  echo "| Hash | Filename |"
                  echo "|------|----------|"
                  for FILE in releases/*; do
                    echo "| \`$(sha256sum "$FILE" | cut -d' ' -f1)\` | $(basename "$FILE") |"
                  done
                } >> notes.md

                gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file notes.md
