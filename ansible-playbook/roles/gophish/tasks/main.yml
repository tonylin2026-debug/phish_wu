---
# This role is deliberately thin. All of the install logic lives in
# deploy/install.sh, which is exercised end to end by the "Ubuntu deployment"
# workflow on every push. Reimplementing it here in Ansible would mean two
# implementations that drift apart, with only one of them tested.

- name: Install prerequisites
  ansible.builtin.apt:
    name: "{{ install_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ hostname }}"
  when: hostname | length > 0

# --------------------------------------------------------------- firewall ---

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ ssh_allowed_from }}"
  when: enable_ufw_firewall

- name: Allow HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"
    - "443"
  when: enable_ufw_firewall

# gophish only binds loopback - nginx is what listens publicly - so there is
# deliberately no rule for 3333 or 8080.
- name: Enable the firewall, default deny
  community.general.ufw:
    state: enabled
    policy: deny
  when: enable_ufw_firewall

# ---------------------------------------------------------------- install ---

- name: Copy the installer onto the host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../deploy/install.sh"
    dest: /usr/local/sbin/phish_wu-install.sh
    owner: root
    group: root
    mode: "0750"

- name: Install or upgrade phish_wu
  ansible.builtin.command:
    cmd: >-
      /usr/local/sbin/phish_wu-install.sh
      --release {{ phish_wu_release | quote }}
      --install-dir {{ install_dir | quote }}
      --user {{ gophish_user | quote }}
      --admin-domain {{ admin_domain | quote }}
      --contact-address {{ contact_address | quote }}
  register: phish_wu_install
  changed_when: true
  notify: Restart gophish

- name: Show the installer output
  ansible.builtin.debug:
    var: phish_wu_install.stdout_lines

# ------------------------------------------------------------------ nginx ---

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
  when: configure_nginx

- name: Deploy the nginx site
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/phish_wu
    owner: root
    group: root
    mode: "0644"
  when: configure_nginx
  notify: Reload nginx

- name: Enable the site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/phish_wu
    dest: /etc/nginx/sites-enabled/phish_wu
    state: link
    force: true
  when: configure_nginx
  notify: Reload nginx

- name: Remove the default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  when: configure_nginx
  notify: Reload nginx

# ----------------------------------------------------------------- report ---

- name: Read the initial admin password from the journal
  ansible.builtin.shell: >-
    journalctl -u gophish --no-pager | grep -m1 'Please login with the username' || true
  register: initial_password
  changed_when: false

- name: Initial credentials
  ansible.builtin.debug:
    msg: >-
      {{ initial_password.stdout | default('already initialised - the password was only printed on first start', true) }}
  when: initial_password.stdout | length > 0
