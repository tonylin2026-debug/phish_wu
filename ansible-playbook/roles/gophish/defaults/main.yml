---
# Which build to install. "latest" resolves the newest GitHub release of this
# fork; otherwise give an exact tag such as "v0.12.1-wu1".
phish_wu_release: latest

install_dir: /opt/gophish
gophish_user: gophish

# Public hostnames served by nginx. admin_domain also goes into
# trusted_origins, without which the CSRF origin check rejects every login
# made through the proxy.
admin_domain: admin.example.com
phish_domain: phish.example.com

# Shown to recipients who query the transparency endpoint, and sent as the
# X-Gophish-Contact header on every simulated mail.
contact_address: security@example.com

# Leave empty to keep the existing hostname.
hostname: ""

# Firewall. gophish binds loopback only, so 3333 and 8080 are never opened.
enable_ufw_firewall: true
ssh_allowed_from: any          # narrow this to your bastion or VPN range

configure_nginx: true

# TLS certificates for nginx. The defaults assume certbot has already issued
# them; this role does not run certbot.
admin_cert_path: /etc/letsencrypt/live/{{ admin_domain }}/fullchain.pem
admin_key_path: /etc/letsencrypt/live/{{ admin_domain }}/privkey.pem
phish_cert_path: /etc/letsencrypt/live/{{ phish_domain }}/fullchain.pem
phish_key_path: /etc/letsencrypt/live/{{ phish_domain }}/privkey.pem

# Source addresses allowed to reach the admin interface. Anyone who reaches it
# can read every captured credential. Empty means no restriction, which is
# almost never what you want.
admin_allowed_sources: []
#   - 203.0.113.0/24
#   - 198.51.100.17/32

install_packages:
  - unzip
  - curl
  - ca-certificates
# No MTA: mail is relayed through an external SMTP provider configured in the
# web UI under Sending Profiles.
# No database server: this deployment uses SQLite, which needs nothing
# installed.
