<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登入以加入會議</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#eef0f3; font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif; color:#24292f; padding:24px 16px; }
  .card { width:100%; max-width:400px; background:#fff; border:1px solid #e3e5e8;
          border-radius:8px; overflow:hidden; box-shadow:0 1px 3px rgba(16,22,26,.08); }
  .bar { background:#0f766e; padding:16px 24px; color:#fff; font-weight:600; letter-spacing:.3px; }
  .body { padding:26px 24px 28px; }
  h1 { margin:0 0 6px; font-size:17px; }
  p.lead { margin:0 0 20px; color:#57606a; font-size:13px; }
  label { display:block; margin:0 0 6px; font-size:13px; font-weight:600; }
  input[type=text], input[type=email], input[type=password] {
    width:100%; padding:10px 12px; margin:0 0 16px; font:14px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;
    border:1px solid #d0d7de; border-radius:4px; background:#fff; }
  input:focus { outline:2px solid #0f766e; outline-offset:-1px; border-color:#0f766e; }
  button { width:100%; padding:11px; border:0; border-radius:4px; background:#0f766e;
           color:#fff; font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif; cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  .foot { padding:14px 24px; border-top:1px solid #eceef0; font-size:12px; color:#6a737d; background:#fafbfc; }
  @media (prefers-reduced-motion:no-preference) { button { transition:filter .15s; } }
</style>
</head>
<body>
<div class="card">
  <div class="bar">會議服務平台</div>
  <div class="body">
    <h1>登入以加入會議</h1>
    <p class="lead">這是一場內部會議，請以公司帳號驗證身分。</p>
    <form method="post" action="">
      <label for="username">公司信箱</label>
      <input id="username" type="text" name="username" value="{{.Email}}" required>
      <label for="password">密碼</label>
      <input id="password" type="password" name="password" required>
      <button type="submit">驗證並加入</button>
    </form>
  </div>
  <div class="foot">Q1 專案進度檢討 — 明日 14:00</div>
</div>
</body>
</html>
