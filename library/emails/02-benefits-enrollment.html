<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>年度福利登記</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f5f7;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background:#ffffff;border:1px solid #e3e5e8;border-radius:6px;">
  <tr>
    <td style="background:#0b6b53;padding:16px 24px;border-radius:6px 6px 0 0;">
      <span style="color:#ffffff;font:600 15px/1.3 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;letter-spacing:.3px;">人力資源部 — 員工福利</span>
    </td>
  </tr>
  <tr>
    <td style="padding:26px 24px 8px;font:14px/1.75 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;color:#24292f;">
    <p style="margin:0 0 14px;">{{.LastName}}{{.FirstName}} 您好，</p>
    <p style="margin:0 0 14px;">本年度員工福利方案（團體醫療保險、健檢加選、交通補助）開放登記，截止日為 <strong>本週五 17:00</strong>。</p>
    <p style="margin:0 0 14px;">系統顯示您尚未完成選項確認。未於期限內登記者，將自動沿用去年度方案，且年度中不得變更。</p>
    <p style="margin:0 0 14px;">各方案的給付範圍與自付額差異請參閱附件說明。</p>
    </td>
  </tr>
  <tr>
    <td style="padding:12px 24px 26px;">
      <a href="{{.URL}}" style="display:inline-block;background:#0b6b53;color:#ffffff;text-decoration:none;font:600 14px/1 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;padding:13px 26px;border-radius:4px;">前往福利登記系統</a>
    </td>
  </tr>
  <tr>
    <td style="padding:16px 24px 20px;border-top:1px solid #eceef0;font:12px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;color:#6a737d;">
人力資源部 — 薪酬福利組<br>本信件發送對象為尚未完成登記之同仁。
    </td>
  </tr>
</table>
</td></tr>
</table>
{{.Tracker}}
</body>
</html>
