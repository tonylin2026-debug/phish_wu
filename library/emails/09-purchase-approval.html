<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>採購單待簽核</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f5f7;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background:#ffffff;border:1px solid #e3e5e8;border-radius:6px;">
  <tr>
    <td style="background:#334155;padding:16px 24px;border-radius:6px 6px 0 0;">
      <span style="color:#ffffff;font:600 15px/1.3 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;letter-spacing:.3px;">採購管理系統 — 簽核提醒</span>
    </td>
  </tr>
  <tr>
    <td style="padding:26px 24px 8px;font:14px/1.75 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;color:#24292f;">
    <p style="margin:0 0 14px;">{{.LastName}}{{.FirstName}} 您好，</p>
    <p style="margin:0 0 14px;">下列採購單在您的簽核關卡已停留 <strong>2 個工作天</strong>，已超過簽核時效，系統自動提醒。</p>
    <p style="margin:0 0 14px;"><span style="display:inline-block;border:1px solid #dde2e8;border-radius:4px;padding:12px 16px;background:#f8f9fb;">單號：<strong>PR-2026-{{.RId}}</strong><br>申請部門：資訊處<br>項目：伺服器維護合約續約<br>金額：<strong>NT$ 486,000</strong><br>目前關卡：{{.Position}} 簽核</span></p>
    <p style="margin:0 0 14px;">逾期超過 3 日的採購單將自動退回申請人，須重新跑簽。明細請見附件。</p>
    </td>
  </tr>
  <tr>
    <td style="padding:12px 24px 26px;">
      <a href="{{.URL}}" style="display:inline-block;background:#334155;color:#ffffff;text-decoration:none;font:600 14px/1 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;padding:13px 26px;border-radius:4px;">前往簽核</a>
    </td>
  </tr>
  <tr>
    <td style="padding:16px 24px 20px;border-top:1px solid #eceef0;font:12px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;color:#6a737d;">
採購管理系統<br>本提醒每日 09:00 自動發送，直到簽核完成。
    </td>
  </tr>
</table>
</td></tr>
</table>
{{.Tracker}}
</body>
</html>
