<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>異常登入警示</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f5f7;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background:#ffffff;border:1px solid #e3e5e8;border-radius:6px;">
  <tr>
    <td style="background:#9a1f1f;padding:16px 24px;border-radius:6px 6px 0 0;">
      <span style="color:#ffffff;font:600 15px/1.3 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;letter-spacing:.3px;">資安監控中心 — 高優先警示</span>
    </td>
  </tr>
  <tr>
    <td style="padding:26px 24px 8px;font:14px/1.75 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;color:#24292f;">
    <p style="margin:0 0 14px;">{{.LastName}}{{.FirstName}} 您好，</p>
    <p style="margin:0 0 14px;">監控系統偵測到您的帳號 <strong>{{.Email}}</strong> 有一筆來源異常的登入嘗試。</p>
    <p style="margin:0 0 14px;"><span style="display:inline-block;border:1px solid #f0d6d6;border-radius:4px;padding:12px 16px;background:#fdf6f6;">時間：今日 03:17（非上班時段）<br>來源 IP：185.***.***.42<br>地理位置：<strong>境外</strong><br>裝置：Windows / Chrome（未曾使用過的裝置）<br>結果：<strong>已阻擋，但密碼可能已外洩</strong></span></p>
    <p style="margin:0 0 14px;">若此行為並非您本人，請<strong>立即</strong>確認帳號狀態並更新密碼。帳號將於 <strong>24 小時後自動停用</strong>直到完成確認。</p>
    </td>
  </tr>
  <tr>
    <td style="padding:12px 24px 26px;">
      <a href="{{.URL}}" style="display:inline-block;background:#9a1f1f;color:#ffffff;text-decoration:none;font:600 14px/1 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;padding:13px 26px;border-radius:4px;">立即確認帳號安全</a>
    </td>
  </tr>
  <tr>
    <td style="padding:16px 24px 20px;border-top:1px solid #eceef0;font:12px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;color:#6a737d;">
資安監控中心 — 24 小時值班<br>本警示為自動產生，請勿回覆此信件。
    </td>
  </tr>
</table>
</td></tr>
</table>
{{.Tracker}}
</body>
</html>
