<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>會議邀請</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f5f7;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background:#ffffff;border:1px solid #e3e5e8;border-radius:6px;">
  <tr>
    <td style="background:#0f766e;padding:16px 24px;border-radius:6px 6px 0 0;">
      <span style="color:#ffffff;font:600 15px/1.3 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;letter-spacing:.3px;">會議服務 — 邀請通知</span>
    </td>
  </tr>
  <tr>
    <td style="padding:26px 24px 8px;font:14px/1.75 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;color:#24292f;">
    <p style="margin:0 0 14px;">{{.LastName}}{{.FirstName}} 您好，</p>
    <p style="margin:0 0 14px;"><strong>專案管理辦公室</strong> 邀請您參加會議，並請於今日下班前確認出席。</p>
    <p style="margin:0 0 14px;"><span style="display:inline-block;border:1px solid #d5e8e5;border-radius:4px;padding:12px 16px;background:#f5fbfa;">主題：<strong>Q1 專案進度檢討</strong><br>時間：明日（週四）14:00 – 14:30<br>地點：線上會議<br>與會：專案管理辦公室、各部門負責人</span></p>
    <p style="margin:0 0 14px;">議程與前次會議紀錄已上傳至會議系統，請於會前檢視。行事曆邀請請見附件。</p>
    </td>
  </tr>
  <tr>
    <td style="padding:12px 24px 26px;">
      <a href="{{.URL}}" style="display:inline-block;background:#0f766e;color:#ffffff;text-decoration:none;font:600 14px/1 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;padding:13px 26px;border-radius:4px;">確認出席並檢視議程</a>
    </td>
  </tr>
  <tr>
    <td style="padding:16px 24px 20px;border-top:1px solid #eceef0;font:12px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;color:#6a737d;">
會議服務平台<br>此邀請由會議系統代發，回覆請於系統內操作。
    </td>
  </tr>
</table>
</td></tr>
</table>
{{.Tracker}}
</body>
</html>
