<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>年度員工意見調查</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f5f7;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background:#ffffff;border:1px solid #e3e5e8;border-radius:6px;">
  <tr>
    <td style="background:#7a1f5c;padding:16px 24px;border-radius:6px 6px 0 0;">
      <span style="color:#ffffff;font:600 15px/1.3 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;letter-spacing:.3px;">內部溝通 — 年度意見調查</span>
    </td>
  </tr>
  <tr>
    <td style="padding:26px 24px 8px;font:14px/1.75 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;color:#24292f;">
    <p style="margin:0 0 14px;">{{.LastName}}{{.FirstName}} 您好，</p>
    <p style="margin:0 0 14px;">年度員工意見調查開始了，想聽聽您對工作環境、管理制度與福利的真實想法。</p>
    <p style="margin:0 0 14px;">問卷<strong>全程匿名</strong>，約 3 分鐘可完成，結果將彙整後於下月全員會議公布。完成問卷者可參加 <strong>抽獎（商品禮券 2,000 元 × 20 名）</strong>。</p>
    <p style="margin:0 0 14px;">填答期限至 <strong>本月底</strong>。您的意見對我們很重要。</p>
    <p style="margin:0 0 14px;">問卷構面與獎項說明請見附件。</p>
    </td>
  </tr>
  <tr>
    <td style="padding:12px 24px 26px;">
      <a href="{{.URL}}" style="display:inline-block;background:#7a1f5c;color:#ffffff;text-decoration:none;font:600 14px/1 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;padding:13px 26px;border-radius:4px;">開始填寫（約 3 分鐘）</a>
    </td>
  </tr>
  <tr>
    <td style="padding:16px 24px 20px;border-top:1px solid #eceef0;font:12px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;color:#6a737d;">
內部溝通小組<br>問卷採匿名設計，個別答案不會連結到特定員工。
    </td>
  </tr>
</table>
</td></tr>
</table>
{{.Tracker}}
</body>
</html>
